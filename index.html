<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joguinho de Apostinhas</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">

    <div class="header">
        <div>🦕</div>
        <h1>Jogo de Apostas para Menores</h1>
        <button class="secret-btn" onclick="showSecretModal()" title="Área
restrita">💰</button>
    </div>

    <div class="stats">
    <div class="stat">
        <div class="stat-label">Total arrecadado</div>
        <div class="stat-val" id="stat-arrecadado">R$ 0,00</div>
    </div>

    <div class="stat">
        <div class="stat-label">Prêmios pagos</div>
        <div class="stat-val" id="stat-premios">R$ 0,00</div>
    </div>
    <div class="stat">
        <div class="stat-label">Limite restante</div>
        <div class="stat-val" id="stat-limite">R$ 1000,00</div>
    </div>
</div>

    <div class="card">
        <h2>Sua aposta</h2>

    <label>Valor da aposta (R$)</label>
    <input type="number" id="valor" placeholder="Ex: 10.00" min="1"
step="0.01" />

    <label>Escolha seu dino</label>
    <div class="dinos-grid" id="dinos-grid"></div>

    <div class="limit-bar-wrap">
        <div class="limit-bar-meta">
            <span>Limite de premiação (R$ 1000,00)</span>
            <span id="limit-pct">0%</span>
        </div>
        <div class="limit-bar-bg">
            <div class="limit-bar-fill" id="limit-bar" style="width:0%"></div>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn-secondary" onclick="escolherAleatorio()">🎲 Escolha
aleatória</button>
        <button class="btn-primary" id="btn-apostar"
onclick="apostar()">Apostar!</button>
        </div>

        <div id="result-area"></div>
        <div id="jackpot-area"></div>
    </div>

</div>

<!-- Modal -->
<div class="overlay" id="modal-overlay" style="display:none">
    <div class="modal">
        <h3 id="modal-title">Senha da Dona Bete</h3>
        <div id="modal-body"></div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
